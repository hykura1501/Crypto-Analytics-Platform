services:
  # PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: crypto_postgres
    environment:
      POSTGRES_DB: crypto_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - crypto-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: crypto_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crypto-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Message Broker (KRaft mode)
  kafka:
    image: apache/kafka:3.7.0
    container_name: crypto_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "29092:29092"
    networks:
      - crypto-network
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: crypto_kafka_ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - crypto-network
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: crypto_api_gateway
    depends_on:
      auth-service:
        condition: service_started
      market-service:
        condition: service_started
      crawler-service:
        condition: service_started
    environment:
      PORT: "8080"
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      AUTH_SERVICE_URL: http://auth-service:8081
      MARKET_SERVICE_URL: http://market-service:8082
      CRAWLER_SERVICE_URL: http://crawler-service:8083
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
    ports:
      - "8080:8080"
    networks:
      - crypto-network
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: crypto_auth_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: crypto_db
      DB_SSLMODE: disable

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # JWT
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h

      # Server
      SERVER_PORT: 8081
      GIN_MODE: debug
    ports:
      - "8081:8081"
    networks:
      - crypto-network
    restart: unless-stopped

  # Market Service
  market-service:
    build:
      context: ./services/market-service
      dockerfile: Dockerfile
    container_name: crypto_market_service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: crypto_db
      DB_SSLMODE: disable

      # Kafka
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: market_price_updates

      # Binance
      BINANCE_API_URL: https://api.binance.com
      BINANCE_WS_URL: wss://stream.binance.com:9443

      # Server
      SERVER_PORT: 8082
      GIN_MODE: debug

      # Symbols to track
      DEFAULT_SYMBOLS: BTCUSDT,ETHUSDT,BNBUSDT
    ports:
      - "8082:8082"
    networks:
      - crypto-network
    restart: unless-stopped

  # Crawler Service
  crawler-service:
    build:
      context: ./services/crawler-service
      dockerfile: Dockerfile
    container_name: crypto_crawler_service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: crypto_db

      # Kafka
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: news_new_article

      # RSS Feed URLs
      COINDESK_RSS_URL: https://www.coindesk.com/arc/outboundfeeds/rss/
      COINTELEGRAPH_RSS_URL: https://cointelegraph.com/rss

      # Crawler Settings
      CRAWL_INTERVAL_MINUTES: 10
      MAX_ARTICLES_PER_RUN: 20

      # Server
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    networks:
      - crypto-network
    restart: unless-stopped

  # AI Service (Sentiment Analysis)
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: crypto_ai_service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: crypto_db

      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: news_new_article
      KAFKA_GROUP_ID: ai-service-group
    networks:
      - crypto-network
    restart: unless-stopped

networks:
  crypto-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
