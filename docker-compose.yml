  # Traefik Reverse Proxy (New API Gateway)
  traefik:
    image: traefik:v3.6.5
    container_name: crypto_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # CORS configuration
      - "--entrypoints.web.http.middlewares=cors-headers"
    ports:
      - "5000:80" # API Entrypoint
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - crypto-network
    labels:
      - "traefik.enable=true"
      # Global CORS middleware definition
      - "traefik.http.middlewares.cors-headers.headers.accesscontrolallowmethods=GET,OPTIONS,PUT,POST,DELETE,PATCH"
      - "traefik.http.middlewares.cors-headers.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.cors-headers.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors-headers.headers.addvaryheader=true"

