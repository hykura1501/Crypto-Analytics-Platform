version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cryptodb
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_user -d cryptodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://crypto_user:crypto_pass@postgres:5432/cryptodb?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Use binary from Dockerfile build, not volume mount for production
    # For development, uncomment volume and use go image instead
    # volumes:
    #   - ./backend:/app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  crawler:
    build:
      context: ./services/crawler
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://crypto_user:crypto_pass@postgres:5432/cryptodb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./services/crawler:/app
    restart: unless-stopped

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgres://crypto_user:crypto_pass@postgres:5432/cryptodb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./services/ai-service:/app
    restart: unless-stopped
    ports:
      - "9001:9001"
    labels:
      - "traefik.enable=true"
      # Route: /api/v1/ai/*
      - "traefik.http.routers.ai.rule=PathPrefix(`/api/v1/ai`)"
      - "traefik.http.services.ai.loadbalancer.server.port=9001"
      - "traefik.http.routers.ai.middlewares=cors-headers"

volumes:
  postgres_data:

